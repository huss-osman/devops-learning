services:
  web:
    build: .
    ports:
      - "5002:5002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:latest
    ports:
      - "5004:80"
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  redis-data:
